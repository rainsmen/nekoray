name: nekoray
description: A modern cross-platform proxy client (sing-box backend).
publish_to: "none"
version: 5.0.0-beta.5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # gRPC
  grpc: ^4.0.1
  protobuf: ^3.1.0

  # Networking
  dio: ^5.7.0

  # Storage
  path_provider: ^2.1.4

  # UI
  fl_chart: ^0.69.2
  tray_manager: ^0.2.3
  window_manager: ^0.4.3

  # Utils
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Required: I18n.load reads these at runtime. Without this declaration the
    # files are absent from release bundles and translations silently vanish.
    - assets/l10n/
