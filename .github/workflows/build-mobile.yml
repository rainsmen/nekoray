name: Build Mobile

on:
  push:
    branches: [dev, feature/mobile]
    paths:
      - 'nekoray_flutter/**'
      - 'go/**'
      - 'libs/build_android.sh'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android NDK for Go cross-compilation.
      # Must be r28+: the prebuilt libcronet.a (NaiveProxy) uses arm64 pointer-
      # authentication relocations that NDK 27's lld rejects with
      # "unknown relocation (315)". Matches upstream sing-box CI.
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Fetch sing-box source
        run: ./libs/get_source.sh

      - name: Build Android Go core
        run: ./libs/build_android.sh

      - name: Enable Android platform
        working-directory: nekoray_flutter
        run: flutter create --platforms=android --org com.nekoray .

      # The Go core rides inside the APK (jniLibs) — without this the app
      # starts but finds no core to talk to. build_android.sh names ABIs
      # arm64/arm/x86_64; gradle wants arm64-v8a/armeabi-v7a/x86_64.
      - name: Stage Go core .so into jniLibs
        shell: bash
        run: |
          set -euo pipefail
          stage() {
            local src="deployment/android/$1/libnekobox.so"
            local dest="nekoray_flutter/android/app/src/main/jniLibs/$2"
            [ -f "$src" ] || { echo "::error::missing $src"; exit 1; }
            mkdir -p "$dest"
            cp -f "$src" "$dest/"
          }
          stage arm64 arm64-v8a
          stage arm armeabi-v7a
          stage x86_64 x86_64
          find nekoray_flutter/android/app/src/main/jniLibs -type f

      - name: Apply app icon
        working-directory: nekoray_flutter
        run: dart run flutter_launcher_icons

      # Release manifest from `flutter create` grants no INTERNET permission,
      # without which every socket() fails with EPERM on device.
      - name: Patch Android manifest permissions
        run: ./libs/patch_android_manifest.sh

      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: nekoray_flutter
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build App Bundle
        working-directory: nekoray_flutter
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: nekoray-android
          path: |
            nekoray_flutter/build/app/outputs/flutter-apk/*.apk
            nekoray_flutter/build/app/outputs/bundle/release/*.aab
            deployment/android/
          retention-days: 14
          if-no-files-found: error
