name: Build Flutter

on:
  push:
    branches: [dev, feature/flutter, feature/flutter-grpc]
    paths:
      - 'nekoray_flutter/**'
      - 'go/**'
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: nekoray_flutter
        run: flutter analyze
      - name: Check formatting
        working-directory: nekoray_flutter
        run: dart format --set-exit-if-changed .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get
      - name: Test
        working-directory: nekoray_flutter
        run: flutter test --coverage
      - uses: codecov/codecov-action@v4
        with:
          directory: nekoray_flutter/coverage
          flags: flutter

  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          - platform: windows-latest
            target: windows
          - platform: macos-latest
            target: macos
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux needs GTK dev libs
      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get

      - name: Enable platforms
        working-directory: nekoray_flutter
        run: flutter create --platforms=${{ matrix.target }} .

      - name: Build
        working-directory: nekoray_flutter
        run: flutter build ${{ matrix.target }} --release

      - uses: actions/upload-artifact@v4
        with:
          name: nekoray-flutter-${{ matrix.target }}
          path: |
            nekoray_flutter/build/linux/*/bundle/bundle
            nekoray_flutter/build/windows/x64/runner/Release
            nekoray_flutter/build/macos/Build/Products/Release
          retention-days: 14
