name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v5.0.0-beta.4)"
        required: true
      prerelease:
        description: "Prerelease?"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Must match the `go` directive in the module files.
  GO_VERSION: '1.24.x'

jobs:
  build-go-core:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch sing-box source
        run: ./libs/get_source.sh
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./libs/build_go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: deployment/
          if-no-files-found: error

  build-flutter:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: windows
          - platform: ubuntu-latest
            target: linux
          - platform: macos-latest
            target: macos
            package_target: macos-arm64
            core_artifact: core-darwin-arm64
          - platform: macos-latest
            target: macos
            package_target: macos-amd64
            core_artifact: core-darwin-amd64
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    needs: build-go-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get

      - name: Enable platforms
        working-directory: nekoray_flutter
        # android is included (though never built here): flutter_launcher_icons
        # needs its manifest to resolve the package name on every target.
        run: flutter create --platforms=android,${{ matrix.target }} .

      - name: Apply app icon
        working-directory: nekoray_flutter
        run: dart run flutter_launcher_icons

      - name: Build
        working-directory: nekoray_flutter
        run: flutter build ${{ matrix.target }} --release

      - name: Download Go core artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.core_artifact || (matrix.target == 'windows' && 'core-windows-amd64' || matrix.target == 'linux' && 'core-linux-amd64' || 'core-darwin-amd64') }}
          path: deployment/

      - name: Package release
        shell: bash
        run: ./libs/package_flutter_release.sh ${{ matrix.package_target || matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: nekoray-release-${{ matrix.package_target || matrix.target }}
          path: deployment/nekoray-*
          # The packaging script now fails loudly on a missing core binary, but
          # this is the backstop: an empty artifact must never reach a release.
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    needs: build-go-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Fetch sing-box source
        run: ./libs/get_source.sh

      # No continue-on-error: an APK without the Go core is a shell that cannot
      # proxy anything, and shipping one silently is worse than failing here.
      - name: Build Android Go core (.so)
        run: ./libs/build_android.sh

      - name: Enable Android platform
        working-directory: nekoray_flutter
        run: flutter create --platforms=android .

      # The Go core rides inside the APK (jniLibs) — without this the app
      # starts but finds no core to talk to. build_android.sh names ABIs
      # arm64/arm/x86_64; gradle wants arm64-v8a/armeabi-v7a/x86_64.
      - name: Stage Go core .so into jniLibs
        shell: bash
        run: |
          set -euo pipefail
          stage() {
            local src="deployment/android/$1/libnekobox.so"
            local dest="nekoray_flutter/android/app/src/main/jniLibs/$2"
            [ -f "$src" ] || { echo "::error::missing $src"; exit 1; }
            mkdir -p "$dest"
            cp -f "$src" "$dest/"
          }
          stage arm64 arm64-v8a
          stage arm armeabi-v7a
          stage x86_64 x86_64
          find nekoray_flutter/android/app/src/main/jniLibs -type f

      - name: Apply app icon
        working-directory: nekoray_flutter
        run: dart run flutter_launcher_icons

      # Release manifest from `flutter create` grants no INTERNET permission,
      # without which every socket() fails with EPERM on device.
      - name: Patch Android manifest permissions
        run: ./libs/patch_android_manifest.sh

      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: nekoray_flutter
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < nekoray_version.txt)
          SRC=nekoray_flutter/build/app/outputs/flutter-apk
          mkdir -p deployment
          shopt -s nullglob
          apks=("$SRC"/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk" .apk)
            arch=$(echo "$base" | sed 's/app-//; s/-release//')
            cp "$apk" "deployment/nekoray-${VERSION}-android-${arch}.apk"
          done
          ls -la deployment/

      - uses: actions/upload-artifact@v4
        with:
          name: nekoray-release-android
          path: deployment/nekoray-*.apk
          if-no-files-found: error

  create-release:
    needs: [build-flutter, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "nekoray-*.zip" -o -name "nekoray-*.tar.gz" -o -name "nekoray-*.apk" \) \
            -exec cp {} release-assets/ \;
          echo "=== Release assets ==="
          ls -la release-assets/
          count=$(find release-assets -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no release assets were produced"
            exit 1
          fi
          echo "asset count: $count"

      # The updater refuses to install a package it cannot verify, so a release
      # without this file cannot be auto-updated to.
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum nekoray-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate changelog
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # NekoRay ${{ github.event.inputs.tag }}

          ## Downloads

          | Platform | File |
          |---|---|
          | Windows | `nekoray-*-windows64.zip` |
          | Linux | `nekoray-*-linux64.tar.gz` |
          | macOS Apple Silicon | `nekoray-*-macos-arm64.zip` |
          | macOS Intel | `nekoray-*-macos-amd64.zip` |
          | Android arm64 | `nekoray-*-android-arm64-v8a.apk` |
          | Android armv7 | `nekoray-*-android-armeabi-v7a.apk` |
          | Android x86_64 | `nekoray-*-android-x86_64.apk` |

          Verify your download against `SHA256SUMS.txt`:

          ```
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          ## Highlights
          - Flutter Material 3 UI on a sing-box Go core, over gRPC
          - Schema-driven protocol editor
          - Routing rules, DNS settings and traffic charts
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
