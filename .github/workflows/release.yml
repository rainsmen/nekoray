name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v5.0.0-beta.2)"
        required: true
      prerelease:
        description: "Prerelease?"
        type: boolean
        default: true

jobs:
  build-go-core:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Fetch sing-box source
        run: ./libs/get_source.sh
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./libs/build_go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: deployment/

  build-flutter:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: windows
          - platform: ubuntu-latest
            target: linux
          - platform: macos-latest
            target: macos
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    needs: build-go-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get

      - name: Enable platforms
        working-directory: nekoray_flutter
        run: flutter create --platforms=${{ matrix.target }} .

      - name: Build
        working-directory: nekoray_flutter
        run: flutter build ${{ matrix.target }} --release

      - name: Download Go core artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target == 'windows' && 'core-windows-amd64' || matrix.target == 'linux' && 'core-linux-amd64' || 'core-darwin-amd64' }}
          path: deployment/

      - name: Package release
        shell: bash
        run: ./libs/package_flutter_release.sh ${{ matrix.target }}

      - name: Verify archive exists
        shell: bash
        run: |
          ls -la deployment/nekoray-* || echo "WARNING: no archive found"
          find deployment -name "nekoray-*" -type f

      - uses: actions/upload-artifact@v4
        with:
          name: nekoray-release-${{ matrix.target }}
          path: deployment/nekoray-*

  build-android:
    runs-on: ubuntu-latest
    needs: build-go-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Fetch sing-box source
        run: ./libs/get_source.sh

      - name: Build Android Go core (.so)
        run: ./libs/build_android.sh
        continue-on-error: true

      - name: Enable Android platform
        working-directory: nekoray_flutter
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: nekoray_flutter
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version
        shell: bash
        run: |
          VERSION=$(cat nekoray_version.txt | tr -d '[:space:]')
          SRC=nekoray_flutter/build/app/outputs/flutter-apk
          mkdir -p deployment
          for apk in "$SRC"/*.apk; do
            base=$(basename "$apk" .apk)
            # app-arm64-v8a-release.apk -> nekoray-5.0.0-beta.1-android-arm64-v8a.apk
            arch=$(echo "$base" | sed 's/app-//; s/-release//')
            cp "$apk" "deployment/nekoray-${VERSION}-android-${arch}.apk"
          done
          ls -la deployment/

      - uses: actions/upload-artifact@v4
        with:
          name: nekoray-release-android
          path: deployment/nekoray-*.apk

  create-release:
    needs: [build-flutter, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "nekoray-*.zip" -o -name "nekoray-*.tar.gz" -o -name "nekoray-*.apk" \) | \
            while read f; do cp "$f" release-assets/; done
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Generate changelog
        run: |
          cat > CHANGELOG.md << 'EOF'
          # NekoRay ${{ github.event.inputs.tag }}

          ## Flutter Desktop + Mobile Client

          ### Downloads
          #### Desktop
          - Windows: `nekoray-*-windows64.zip`
          - Linux: `nekoray-*-linux64.tar.gz`
          - macOS: `nekoray-*-macos.zip`
          #### Android
          - arm64: `nekoray-*-android-arm64-v8a.apk`
          - armv7: `nekoray-*-android-armeabi-v7a.apk`
          - x86_64: `nekoray-*-android-x86_64.apk`

          ### Highlights
          - Flutter Material 3 UI (replaces C++/Qt)
          - sing-box v1.13.19 upstream core
          - gRPC-based architecture (Go core + Flutter thin client)
          - Cross-platform: Windows, Linux, macOS, Android
          - Schema-driven protocol editor (11 protocols)
          - Routing rules + DNS presets + traffic charts
          - Data migration from old C++ nekoray config
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: release-assets/*
          body_path: CHANGELOG.md
