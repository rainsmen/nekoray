name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v5.0.0-beta.1)"
        required: true
      prerelease:
        description: "Prerelease?"
        type: boolean
        default: true

jobs:
  build-go-core:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Fetch sing-box source
        run: ./libs/get_source.sh
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./libs/build_go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: deployment/

  build-flutter:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: windows
          - platform: ubuntu-latest
            target: linux
          - platform: macos-latest
            target: macos
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    needs: build-go-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nekoray_flutter
        run: flutter pub get

      - name: Enable platforms
        working-directory: nekoray_flutter
        run: flutter create --platforms=${{ matrix.target }} .

      - name: Build
        working-directory: nekoray_flutter
        run: flutter build ${{ matrix.target }} --release

      - name: Download Go core artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target == 'windows' && 'core-windows-amd64' || matrix.target == 'linux' && 'core-linux-amd64' || 'core-darwin-amd64' }}
          path: deployment/

      - name: Package release
        shell: bash
        run: ./libs/package_flutter_release.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: nekoray-release-${{ matrix.target }}
          path: |
            deployment/nekoray-*.zip
            deployment/nekoray-*.tar.gz

  create-release:
    needs: build-flutter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "nekoray-*.zip" -o -name "nekoray-*.tar.gz" | \
            while read f; do cp "$f" release-assets/; done
          ls -la release-assets/

      - name: Generate changelog
        run: |
          cat > CHANGELOG.md << 'EOF'
          # NekoRay ${{ github.event.inputs.tag }}

          ## Phase 2: Flutter Desktop Client

          ### Highlights
          - Modern Flutter Material 3 desktop UI (replaces C++/Qt)
          - sing-box v1.13.19 upstream core
          - gRPC-based architecture (Go core + Flutter thin client)
          - Cross-platform: Windows, Linux, macOS
          - Schema-driven protocol editor (11 protocols)
          - Routing rules + DNS presets + traffic charts
          - Data migration from old C++ nekoray config

          ### Downloads
          - Windows: `nekoray-*-windows64.zip`
          - Linux: `nekoray-*-linux64.tar.gz`
          - macOS: `nekoray-*-macos.zip`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: release-assets/*
          body_path: CHANGELOG.md
