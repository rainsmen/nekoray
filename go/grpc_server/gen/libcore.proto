syntax = "proto3";

package libcore;
option go_package = "grpc_server/gen";

service LibcoreService {
  rpc Exit(EmptyReq) returns (EmptyResp) {}
  rpc Update(UpdateReq) returns (UpdateResp) {}
  //
  rpc Start(LoadConfigReq) returns (ErrorResp) {}
  rpc Stop(EmptyReq) returns (ErrorResp) {}
  rpc Test(TestReq) returns (TestResp) {}
  rpc QueryStats(QueryStatsReq) returns (QueryStatsResp) {}
  rpc ListConnections(EmptyReq) returns (ListConnectionsResp) {}

  // Phase 1: config building / subscription parsing moved to core
  rpc BuildConfig(BuildConfigReq) returns (BuildConfigResp) {}
  rpc ParseSubscription(ParseSubReq) returns (ParseSubResp) {}
  rpc GenerateShareLink(ShareLinkReq) returns (ShareLinkResp) {}

  // Phase 1: rule_set management (sing-box MRS format)
  rpc UpdateRuleSet(UpdateRuleSetReq) returns (ErrorResp) {}
  rpc ListRuleSets(EmptyReq) returns (ListRuleSetsResp) {}
}

message EmptyReq {}

message EmptyResp {}

message ErrorResp {
  string error = 1;
}

message LoadConfigReq {
  string core_config = 1;
  bool enable_nekoray_connections = 2;
  repeated string stats_outbounds = 3;
}

enum TestMode {
  TcpPing = 0;
  UrlTest = 1;
  FullTest = 2;
}

message TestReq {
  TestMode mode = 1;
  int32 timeout = 6;
  // TcpPing
  string address = 2;
  // UrlTest
  LoadConfigReq config = 3;
  string inbound = 4;
  string url = 5;
  // FullTest
  string in_address = 7;
  bool full_latency = 8;
  bool full_speed = 9;
  string full_speed_url = 13;
  int32 full_speed_timeout = 14;
  bool full_in_out = 10;
  bool full_udp_latency = 12;
  //
  bool full_nat = 11 [deprecated = true];
}

message TestResp {
  string error = 1;
  int32 ms = 2;
  string full_report = 3;
}

message QueryStatsReq{
  string tag = 1;
  string direct = 2;
}

message QueryStatsResp{
  int64 traffic = 1;
}

enum UpdateAction {
  Check = 0;
  Download = 1;
}

message UpdateReq {
  UpdateAction action = 1;
  bool check_pre_release = 2;
}

message UpdateResp {
  string error = 1;
  string assets_name = 2;
  string download_url = 3;
  string release_url = 4;
  string release_note = 5;
  bool is_pre_release = 6;
}

message ListConnectionsResp {
  string nekoray_connections_json = 1;
}

// Phase 1: config building / subscription parsing

message BuildConfigReq {
  // Serialized NekoGui data (JSON), mirroring the C++ JsonStore layout.
  bytes profile_json = 1;      // ProxyEntity
  bytes group_json = 2;       // Group
  bytes routing_json = 3;     // Routing
  bytes datastore_json = 4;   // DataStore (global settings)
  bool for_test = 5;
  bool for_export = 6;
}

message BuildConfigResp {
  string error = 1;
  string core_config = 2;     // Full sing-box config JSON
  bytes ext_results = 3;     // ExternalBuildResult list (JSON)
}

message ParseSubReq {
  string content = 1;
  string format = 2;          // "auto", "raw", "clash", "sip008", "base64"
}

message ParseSubResp {
  string error = 1;
  repeated bytes profiles = 2;  // ProxyEntity JSON array
}

message ShareLinkReq {
  bytes profile_json = 1;
  string format = 2;          // "nekoray", "v2rayn", "clash"
}

message ShareLinkResp {
  string error = 1;
  string link = 2;
}

// Phase 1: rule_set management (sing-box MRS format)

message UpdateRuleSetReq {
  string url = 1;
  string tag = 2;
  string format = 3;        // "source" or "binary"
  bool download = 4;        // if false, only register; if true, fetch now
}

message RuleSetInfo {
  string tag = 1;
  string type = 2;          // "remote" or "local"
  string format = 3;        // "source" or "binary"
  string url = 4;
  int64  updated_at = 5;
  int64  size = 6;
}

message ListRuleSetsResp {
  repeated RuleSetInfo rule_sets = 1;
}
